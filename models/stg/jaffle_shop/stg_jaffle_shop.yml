version: 2

models:
  - name: stgCustomers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
  
  - name: stgOrders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      
      - name: status
        tests:
          - accepted_values:
              arguments:
                values:  ['completed', 'shipped', 'returned', 'return_pending', 'placed']